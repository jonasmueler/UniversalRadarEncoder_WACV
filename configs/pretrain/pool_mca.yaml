# Leave-one-sensor-out: CI4R-Gait held out (mmRadPose + CubeLearn + CI4R-ASL). Also the encoder for the leave-one-subject-out CI4R-Gait table.
_base_: pool_base.yaml

dataset:
  sources: [mmradpose, cubelearn, cubelearn_hgr, cubelearn_agr, ci4r]
  mixture_weights: [0.333333, 0.111111, 0.111111, 0.111111, 0.333334]

training:
  checkpoint_dir: runs/pool_mca

wandb:
  run_name: pool_mca
